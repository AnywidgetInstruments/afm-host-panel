site_name: afm-host-panel
site_description: Grafana panel plugin hosting anywidget front-end modules (AFM)
site_url: https://anywidgetinstruments.github.io/afm-host-panel/
repo_url: https://github.com/AnywidgetInstruments/afm-host-panel
edit_uri: ""
# Buildable offline: no Google Fonts, no CDN assets.
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - content.code.copy
  # System preference by default; the toggle cycles light, dark, system.
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-sunny, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-night, name: Switch to system preference }
nav:
  - Home: index.md
  - User guide: guide.md
  - Built-in widgets:
      - anywidget-instruments-industrial: instruments.md
      - anywidget-instruments-automotive: automotives.md
      - anywidget-instruments-aeronautics: aeronautics.md
  - Compatibility and limits: compatibility.md
  - Design: design.md
  - Specification: specification.md
  - Roadmap: roadmap.md
  - Development: development.md
plugins:
  - search
  - llmstxt:
      markdown_description: Grafana panel plugin that hosts anywidget front-end modules (AFM) with a model fed by Grafana data.
      full_output: llms-full.txt
      sections:
        User documentation:
          - index.md
          - guide.md
          - instruments.md
          - automotives.md
          - aeronautics.md
          - compatibility.md
        Design and development:
          - design.md
          - specification.md
          - roadmap.md
          - development.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
